# Heap disesuaikan dengan RAM mesin (7 GB). Nilai template -Xmx8G lebih besar
# dari RAM fisik sehingga Gradle terus swap dan build jadi sangat lambat.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
kotlin.incremental=true
