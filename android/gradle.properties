# Heap disesuaikan dengan RAM mesin (7 GB). Nilai template -Xmx8G lebih besar
# dari RAM fisik sehingga Gradle terus swap dan build jadi sangat lambat.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
# Plugin tflite_flutter 0.11.0 memakai Java 1.8, sedangkan Kotlin dipaksa
# ke 17 di android/build.gradle.kts. Selisih target ini tidak berbahaya
# (Java 8 + Kotlin 17 sama-sama didukung Android), jadi validasi dibuat
# warning agar build rilis tidak gagal.
kotlin.jvm.target.validation.mode=warning
